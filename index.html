<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Household Electricity Consumption Forecasting System
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

    <header>

        <svg class="bolt-icon" viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2 L4 14 H11 L10 22 L20 9 H13 L13 2 Z"
                  stroke="currentColor" stroke-width="1.6"
                  stroke-linejoin="round" fill="none" />
        </svg>

        <div>
            <h1>Household Electricity Consumption Forecasting</h1>
            <p class="subtitle">
                Predicts hourly consumption from weather, occupancy
                and appliance usage.
            </p>
        </div>

    </header>


    <div class="panel">

        <h2>Environment</h2>

        <div class="grid">

            <div class="field">
                <label for="temperature">Temperature (°C)</label>
                <input id="temperature" type="number" value="30" step="0.1">
            </div>

            <div class="field">
                <label for="humidity">Humidity (%)</label>
                <input id="humidity" type="number" value="65" step="0.1">
            </div>

            <div class="field">
                <label for="day">Day</label>
                <select id="day">
                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                    <option>Friday</option>
                    <option>Saturday</option>
                    <option>Sunday</option>
                </select>
            </div>

            <div class="field">
                <label for="weekend">Weekend?</label>
                <select id="weekend">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="field">
                <label for="holiday">Holiday?</label>
                <select id="holiday">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

        </div>

    </div>


    <div class="panel">

        <h2>Household situation</h2>

        <div class="grid">

            <div class="field">
                <label for="people">People at home</label>
                <input id="people" type="number" value="2" min="0" max="10">
            </div>

            <div class="field">
                <label for="homeHours">Hours at home</label>
                <input id="homeHours" type="number" value="8" min="0" max="24" step="0.5">
            </div>

        </div>

    </div>


    <div class="panel">

        <h2>Appliance usage</h2>

        <div class="grid">

            <div class="field">
                <label for="ac">AC hours</label>
                <input id="ac" type="number" value="2" min="0" max="24" step="0.5">
            </div>

            <div class="field">
                <label for="fan">Fan hours</label>
                <input id="fan" type="number" value="5" min="0" max="24" step="0.5">
            </div>

            <div class="field">
                <label for="tv">TV hours</label>
                <input id="tv" type="number" value="2" min="0" max="24" step="0.5">
            </div>

            <div class="field">
                <label for="washing">Washing machine used?</label>
                <select id="washing">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

        </div>

        <button onclick="predictConsumption()">
            Predict consumption
        </button>

    </div>


    <div class="readout-panel">

        <span class="readout-label">Predicted consumption</span>

        <div class="readout-screen">
            <div class="result" id="result">0.000</div>
            <div class="unit">kWh</div>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
